name: Dropshipping Safe Fix Branch CI
on:
  push:
    branches:
      - 'autofix/shadow-import-*'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_dropship_v01.py tests/test_dropship_v84.py tests/test_dropship_v83.py
