name: Warashibe Codex fallback gate

on:
  push:
    branches: [research-lab]
    paths:
      - "research_lab/codex_fallback_milestone.py"
      - "research_lab/test_codex_fallback_milestone.py"
      - ".github/workflows/warashibe-codex-fallback-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline milestone gate test
        env:
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: python -m research_lab.test_codex_fallback_milestone
