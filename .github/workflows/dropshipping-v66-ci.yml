name: Dropshipping v6.6 CI

on:
  push:
    branches:
      - feature/dropshipping-v66-fee-terms-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run full dropshipping regression and v6.6 tests
        run: |
          PYTHONPATH=. python -m pytest -q             tests/test_dropship_v01.py             tests/test_dropship_v64.py             tests/test_dropship_v65.py             tests/test_dropship_v66.py
      - name: Verify Flask v6.6 endpoint
        run: python -c "from app import app; assert '/dropship/v6.6/status' in [str(r) for r in app.url_map.iter_rules()]"
      - name: Verify actual evidence runner imports
        run: PYTHONPATH=. python -m py_compile scripts/dropship_actual_evidence.py
