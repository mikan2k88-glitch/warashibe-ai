name: Warashibe AI Research Lab Schedule
# Supabase queue bridge uses GitHub OIDC; no Supabase secret is stored in GitHub.
# Queue executor polls frequently; the heavier research cycle remains hourly.

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/research-lab-schedule.yml"

concurrency:
  group: warashibe-ai-research-lab
  cancel-in-progress: false

jobs:
  queue-executor:
    if: github.event_name != 'schedule' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research-lab
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll Supabase development queue
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Queue poll attempt ${attempt}/5"
            python -m research_lab.dev_queue_executor
            if [ "${attempt}" -lt 5 ]; then
              sleep 60
            fi
          done

  research-cycle:
    if: github.event_name != 'schedule' || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout latest research branch
        uses: actions/checkout@v4
        with:
          ref: research-lab

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run research cycle
        run: python -m research_lab.runner

      - name: Upload research snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-lab-schedule-${{ github.run_id }}
          path: research_output/
          retention-days: 30
