name: Dropshipping v8.3 Safe Repair Proposal CI
on:
  push:
    branches: [feature/v83-repair-proposals]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_dropship_v83.py tests/test_dropship_v82_debug.py tests/test_dropship_auto_debug.py
