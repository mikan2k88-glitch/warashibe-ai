name: Dropshipping v6.7 CI

on:
  push:
    branches:
      - feature/dropshipping-v67-ebay-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run v6.7 evidence tests
        run: PYTHONPATH=. python -m pytest -q tests/test_dropship_v67.py
