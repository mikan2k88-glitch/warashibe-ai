name: Dropshipping v6.9 Cost Evidence CI
on:
  push:
    branches:
      - feature/dropshipping-v69-cost-model
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_dropship_v69.py tests/test_dropship_v68.py tests/test_dropship_v67.py tests/test_dropship_v66.py tests/test_dropship_v65.py tests/test_dropship_v64.py
