name: Dropshipping v7.6 Shadow Optimization CI
on:
  push:
    branches: [feature/v76-shadow-search-optimization]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_dropship_v76_opt.py tests/test_dropship_v75_mvp.py tests/test_dropship_v70.py tests/test_dropship_v70_freight.py tests/test_dropship_v70_variant.py
