name: Dropshipping v6.11 Evidence Mapping CI
on:
  push:
    branches: [feature/dropshipping-v611-evidence-mapping]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_dropship_v611.py tests/test_dropship_v610.py tests/test_dropship_v69.py
