name: Dropshipping v6.4 CI

on:
  push:
    branches:
      - feature/dropshipping-v64-cost-completeness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dropshipping-v64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run full dropshipping regression and v6.4 tests
        run: |
          PYTHONPATH=. python -m pytest -q             tests/test_dropship_v01.py             tests/test_dropship_v64.py
      - name: Import Flask app
        run: python -c "from app import app; assert '/dropship/v6.4/status' in [str(r) for r in app.url_map.iter_rules()]"

  cj-read:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify CJ real read still persists supplier evidence
        env:
          CJ_ACCESS_TOKEN: ${{ secrets.CJ_ACCESS_TOKEN }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          CJ_REFRESH_TOKEN: ${{ secrets.CJ_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DROPSHIP_CJ_SHADOW_MAX_ITEMS: "5"
          DROPSHIP_CJ_PAGE_SIZE: "5"
          DROPSHIP_CJ_MAX_PAGES: "1"
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/dropship_cj_supplier_shadow.py | tee dropshipping-v64-cj-read.json
      - name: Upload CJ read evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dropshipping-v64-cj-read
          path: dropshipping-v64-cj-read.json
          if-no-files-found: warn
