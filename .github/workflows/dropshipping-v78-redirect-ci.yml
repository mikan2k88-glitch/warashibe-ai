name: Dropshipping v7.8 Artifact Redirect CI
on:
  push:
    branches: [feature/v78-artifact-download-redirect]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_dropship_v78.py tests/test_dropship_v77.py
