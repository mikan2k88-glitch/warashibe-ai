name: Dropshipping v7.1 Verified Fee CI
on:
  push:
    branches: [feature/v71-verified-fee-readiness]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_dropship_v69.py tests/test_dropship_v610.py tests/test_dropship_v611.py tests/test_dropship_v70.py tests/test_dropship_v70_variant.py
