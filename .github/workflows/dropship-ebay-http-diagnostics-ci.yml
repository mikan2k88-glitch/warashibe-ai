name: Dropship eBay HTTP Diagnostic CI
on:
  push:
    branches: [fix/dropship-ebay-return-http-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_ebay_return_diagnostics.py tests/test_dropship_v67.py tests/test_dropship_v68.py
