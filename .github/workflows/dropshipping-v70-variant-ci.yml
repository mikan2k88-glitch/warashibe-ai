name: Dropshipping v7 CJ Variant Price CI
on:
  push:
    branches: [feature/v70-cj-variant-price-matched]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_dropship_v70_variant.py tests/test_dropship_v70_freight.py tests/test_dropship_v70_shadow.py tests/test_dropship_v70.py
