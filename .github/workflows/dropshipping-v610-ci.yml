name: Dropshipping v6.10 Single Candidate CI
on:
  push:
    branches: [feature/dropshipping-v610-single-candidate-economics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_dropship_v610.py tests/test_dropship_v69.py tests/test_dropship_v68.py tests/test_dropship_v67.py
