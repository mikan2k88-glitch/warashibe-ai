name: Dropshipping v5.2 Promotion Proof

on:
  workflow_dispatch:
  schedule:
    - cron: "27 * * * *"

permissions:
  contents: read

concurrency:
  group: dropshipping-v52-promotion-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build v5.2 Promotion Review evidence
        run: |
          python - <<'PY' | tee dropshipping-v52-promotion-proof.json
          import json
          from dropship.v52_proof import build_v52_proof, build_v52_acceptance
          from dropship.v52_release import build_v52_release_status

          proof = build_v52_proof()
          acceptance = build_v52_acceptance()
          status = build_v52_release_status()

          output = {
              "proof": proof,
              "acceptance": acceptance,
              "status": status,
          }
          print(json.dumps(output, ensure_ascii=False, sort_keys=True))

          assert proof["passed"] is True
          assert acceptance["passed"] is True
          assert status["status"] == "promotion_review_endpoint_reached"
          assert status["automatic_promotion_enabled"] is False
          assert status["live_execution_allowed"] is False
          PY
      - name: Upload v5.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dropshipping-v52-promotion-proof
          path: dropshipping-v52-promotion-proof.json
          if-no-files-found: warn
