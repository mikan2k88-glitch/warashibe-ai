name: eBay Account Deletion Endpoint CI

on:
  push:
    branches:
      - feature/ebay-account-deletion-endpoint
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run endpoint tests and full dropshipping regression
        run: |
          PYTHONPATH=. python -m pytest -q             tests/test_ebay_account_deletion.py             tests/test_dropship_v01.py             tests/test_dropship_v64.py             tests/test_dropship_v65.py             tests/test_dropship_v66.py
