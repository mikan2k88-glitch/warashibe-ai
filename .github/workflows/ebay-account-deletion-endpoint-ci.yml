name: eBay Account Deletion Endpoint CI

on:
  push:
    branches:
      - feature/ebay-account-deletion-endpoint
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run endpoint and evidence-gate regression tests
        run: |
          PYTHONPATH=. python -m pytest -q             tests/test_ebay_account_deletion.py             tests/test_dropship_v64.py             tests/test_dropship_v65.py             tests/test_dropship_v66.py
      - name: Verify Flask endpoint import
        run: python -c "from app import app; rules=[str(r) for r in app.url_map.iter_rules()]; assert '/dropship/ebay/marketplace-account-deletion' in rules"
