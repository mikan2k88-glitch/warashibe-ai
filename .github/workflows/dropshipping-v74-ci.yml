name: Dropshipping v7.4 Research Preflight CI
on:
  push:
    branches: [feature/v74-evidence-review-endpoint]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_dropship_v74.py tests/test_dropship_v73_endpoint.py tests/test_dropship_v72_capital.py tests/test_dropship_v69.py
