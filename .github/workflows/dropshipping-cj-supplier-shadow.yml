name: Dropshipping CJ Supplier Shadow

on:
  push:
    branches:
      - feature/dropshipping-cj-bootstrap
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: dropshipping-cj-supplier-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run CJ supplier Shadow tests
        run: PYTHONPATH=. python -m pytest -q tests/test_dropship_cj_bootstrap.py

  collect:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect CJ supplier evidence
        env:
          CJ_ACCESS_TOKEN: ${{ secrets.CJ_ACCESS_TOKEN }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          CJ_REFRESH_TOKEN: ${{ secrets.CJ_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DROPSHIP_CJ_SHADOW_MAX_ITEMS: "20"
          DROPSHIP_CJ_PAGE_SIZE: "20"
          DROPSHIP_CJ_MAX_PAGES: "1"
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/dropship_cj_supplier_shadow.py | tee dropshipping-cj-supplier-shadow.json
      - name: Upload CJ supplier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dropshipping-cj-supplier-shadow
          path: dropshipping-cj-supplier-shadow.json
          if-no-files-found: warn
