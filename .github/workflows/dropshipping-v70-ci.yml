name: Dropshipping v7.0 Research CI
on:
  push:
    branches: [feature/dropshipping-v70-research-orchestration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_dropship_v70.py tests/test_dropship_v611.py tests/test_dropship_v610.py tests/test_dropship_v69.py tests/test_dropship_v68.py tests/test_dropship_v67.py
      - run: python -m py_compile scripts/dropship_v70_research.py
