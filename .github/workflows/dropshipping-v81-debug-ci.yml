name: Dropshipping v8.1 Diagnostics CI
on:
  push:
    branches: [feature/v81-auto-debug-diagnostics]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_dropship_auto_debug.py
      - run: PYTHONPATH=. python -m compileall -q dropship/auto_debug_diagnose.py scripts/dropship_auto_debug.py
