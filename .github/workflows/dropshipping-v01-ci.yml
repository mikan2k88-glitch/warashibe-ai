name: Dropshipping v0.1 CI

on:
  push:
    branches:
      - feature/dropshipping-v0.1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dropshipping-v01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run dropshipping tests
        run: python -m pytest -q tests/test_dropship_v01.py
      - name: Import Flask app
        run: python -c "from app import app; print(sorted(str(r) for r in app.url_map.iter_rules() if str(r).startswith('/dropship')))"
