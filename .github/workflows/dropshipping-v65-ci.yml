name: Dropshipping v6.5 CI

on:
  push:
    branches:
      - feature/dropshipping-v65-cost-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run full dropshipping regression and v6.5 tests
        run: |
          PYTHONPATH=. python -m pytest -q             tests/test_dropship_v01.py             tests/test_dropship_v64.py             tests/test_dropship_v65.py
      - name: Import Flask app
        run: python -c "from app import app; assert '/dropship/v6.5/status' in [str(r) for r in app.url_map.iter_rules()]"

  cj-freight-read:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run one-item CJ freight evidence probe
        env:
          CJ_ACCESS_TOKEN: ${{ secrets.CJ_ACCESS_TOKEN }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          CJ_REFRESH_TOKEN: ${{ secrets.CJ_REFRESH_TOKEN }}
          DROPSHIP_CJ_PAGE_SIZE: "1"
          DROPSHIP_CJ_MAX_PAGES: "1"
          DROPSHIP_FREIGHT_DESTINATION: "US"
          DROPSHIP_FREIGHT_QUANTITY: "1"
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/dropship_cj_freight_probe.py | tee dropshipping-v65-cj-freight.json
      - name: Upload CJ freight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dropshipping-v65-cj-freight
          path: dropshipping-v65-cj-freight.json
          if-no-files-found: warn
