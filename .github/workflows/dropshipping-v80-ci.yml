name: Dropshipping v8.0 Research Acceptance CI
on:
  push:
    branches: [feature/v80-research-acceptance]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_dropship_v80.py tests/test_dropship_v79.py tests/test_dropship_v75_mvp.py
