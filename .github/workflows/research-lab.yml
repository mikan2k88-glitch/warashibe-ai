name: Warashibe AI Research Lab

on:
  push:
    branches:
      - research-lab
  workflow_dispatch:
    inputs:
      profile:
        description: Targeted test profile
        required: false
        default: build
        type: choice
        options:
          - build
          - repair
          - scheduler
          - core

permissions:
  contents: read

concurrency:
  group: warashibe-ai-research-lab
  cancel-in-progress: false

jobs:
  build-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WARASHIBE_LAB_PROFILE: ${{ inputs.profile || 'build' }}
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run targeted build-first cycle
        run: python -m research_lab.runner

      - name: Upload cycle snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-lab-${{ github.run_id }}
          path: research_output/
          retention-days: 30
