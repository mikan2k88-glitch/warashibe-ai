name: Warashibe AI Research Lab\n\non:\n  workflow_dispatch:\n  schedule:\n    - cron: "17 */6 * * *"\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: warashibe-ai-research-lab\n  cancel-in-progress: false\n\njobs:\n  research-cycle:\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    steps:\n      - name: Checkout research branch\n        uses: actions/checkout@v4\n        with:\n          ref: research-lab\n\n      - name: Set up Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: "3.13"\n\n      - name: Install dependencies\n        run: pip install -r requirements.txt\n\n      - name: Run autonomous research cycle\n        run: python -m research_lab.runner\n\n      - name: Upload research snapshot\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: research-lab-${{ github.run_id }}\n          path: research_output/\n          retention-days: 30\n