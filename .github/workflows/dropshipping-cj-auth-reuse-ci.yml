name: Dropshipping CJ Auth Reuse CI
on:
  push:
    branches: [fix/cj-429-token-reuse]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_dropship_cj_auth_reuse.py tests/test_dropship_v84.py
